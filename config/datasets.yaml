datasets:
  movies:
    content_type: movie
    source: tmdb_5000_movies
    path: datasets/movies/movies/tmdb_5000_movies.csv
    credits_path: datasets/movies/movies/tmdb_5000_credits.csv
    id_column: id
    title_column: title
    description_column: overview
    category_columns:
      - genres
    creator_columns: []
    release_date_column: release_date
    popularity_column: popularity
    rating_column: vote_average
    metadata_columns:
      - title
      - genres
      - keywords
      - overview
    credits_top_cast: 5

  books:
    content_type: book
    source: google_books_dataset
    path: datasets/books/archive/google_books_dataset.csv
    id_column: book_id
    title_column: title
    description_column: description
    category_columns:
      - categories
      - search_category
    creator_columns:
      - authors
    release_date_column: published_date
    popularity_column: ratings_count
    rating_column: average_rating
    metadata_columns:
      - title
      - subtitle
      - authors
      - categories
      - description

  music:
    content_type: music
    source: spotify_songs
    path: datasets/music/songs/spotify_songs.csv
    id_column: track_id
    title_column: track_name
    description_column: null
    category_columns:
      - playlist_genre
      - playlist_subgenre
    creator_columns:
      - track_artist
    release_date_column: track_album_release_date
    popularity_column: track_popularity
    rating_column: null
    metadata_columns:
      - track_name
      - track_artist
      - track_album_name
      - playlist_genre
      - playlist_subgenre

  # --- Non-entertainment verticals -------------------------------------
  # Amazon Reviews 2023 item metadata, streamed to CSV by
  # scripts.fetch_amazon_metadata. Both share the amazon_meta normalizer;
  # only content_type decides which domain pack they land in.

  health:
    content_type: health
    normalizer: amazon_meta
    source: amazon_reviews_2023
    path: datasets/amazon/meta/Health_and_Household.csv
    id_column: parent_asin
    title_column: title
    description_column: description
    category_columns:
      - categories
    creator_columns:
      - store
    release_date_column: null
    popularity_column: rating_number
    rating_column: average_rating
    metadata_columns:
      - title
      - store
      - main_category
      - categories
      - description

  industrial:
    content_type: industrial
    normalizer: amazon_meta
    source: amazon_reviews_2023
    path: datasets/amazon/meta/Industrial_and_Scientific.csv
    id_column: parent_asin
    title_column: title
    description_column: description
    category_columns:
      - categories
    creator_columns:
      - store
    release_date_column: null
    popularity_column: rating_number
    rating_column: average_rating
    metadata_columns:
      - title
      - store
      - main_category
      - categories
      - description
