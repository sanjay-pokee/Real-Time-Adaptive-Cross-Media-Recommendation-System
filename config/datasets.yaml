datasets:
  movies:
    content_type: movie
    # Was the Kaggle "TMDB 5000 Movie Dataset", a static 2017 export capped at
    # 4,803 rows. TMDb itself carries 1.18M titles, so the ceiling was the file
    # rather than the source. Now fetched live:
    #   python -m scripts.fetch_tmdb_movies --min-votes 100 --from-year 1960
    #   python -m scripts.fetch_tmdb_credits
    # vote_count >= 100 keeps released, reviewed titles and drops the long tail
    # of shorts and unreleased entries, which would embed to noise.
    source: tmdb_api
    path: datasets/tmdb/tmdb_movies.csv
    credits_path: datasets/tmdb/tmdb_credits.csv
    id_column: id
    title_column: title
    description_column: overview
    category_columns:
      - genres
    creator_columns: []
    release_date_column: release_date
    popularity_column: popularity
    rating_column: vote_average
    metadata_columns:
      - title
      - genres
      - keywords
      - overview
    credits_top_cast: 5

  books:
    content_type: book
    # Was a Google Books scrape on Kaggle: 15,147 rows from 149 keyword
    # searches, of which only 8,351 (55%) carried a description and the
    # highest-ranked were SEO spam - "Bestsellers" by "Ivan King, bestsellers".
    # Now fetched live:
    #   python -m scripts.fetch_openlibrary_books
    # Open Library needs no key, and returns the synopsis as a search field, so
    # a page of 100 books costs one request. sort=rating plus a required
    # description and cover is what keeps the rows worth embedding.
    source: openlibrary_api
    path: datasets/books/openlibrary_books.csv
    id_column: book_id
    title_column: title
    description_column: description
    category_columns:
      - categories
      - search_category
    creator_columns:
      - authors
    release_date_column: published_date
    popularity_column: ratings_count
    rating_column: average_rating
    metadata_columns:
      - title
      - subtitle
      - authors
      - categories
      - description

  music:
    content_type: music
    source: spotify_songs
    path: datasets/music/songs/spotify_songs.csv
    id_column: track_id
    title_column: track_name
    description_column: null
    category_columns:
      - playlist_genre
      - playlist_subgenre
    creator_columns:
      - track_artist
    release_date_column: track_album_release_date
    popularity_column: track_popularity
    rating_column: null
    metadata_columns:
      - track_name
      - track_artist
      - track_album_name
      - playlist_genre
      - playlist_subgenre

  # Current music from the live Last.fm API, alongside the Spotify export
  # above rather than replacing it. The Kaggle export stops at 2020, so
  # "what came out recently" returned nothing for music while movies - which
  # are fetched live from TMDb - reached 2026.
  #
  # Same normalizer and the same column names as the Spotify file, so this is
  # a config entry rather than new code:
  #   python -m scripts.fetch_lastfm_tracks
  #
  # Kept as a second source rather than a migration: the Spotify rows are what
  # the LightGCN benchmark and the paper's item counts describe, and swapping
  # them out the week of a review would invalidate both.
  music_lastfm:
    content_type: music
    normalizer: music
    source: lastfm_api
    path: datasets/music/lastfm/lastfm_tracks.csv
    id_column: track_id
    title_column: track_name
    description_column: null
    category_columns:
      - playlist_genre
      - playlist_subgenre
    creator_columns:
      - track_artist
    release_date_column: track_album_release_date
    popularity_column: track_popularity
    rating_column: null
    metadata_columns:
      - track_name
      - track_artist
      - track_album_name
      - playlist_genre
      - playlist_subgenre

  # --- Non-entertainment verticals -------------------------------------
  # Amazon Reviews 2023 item metadata, streamed to CSV by
  # scripts.fetch_amazon_metadata. Both share the amazon_meta normalizer;
  # only content_type decides which domain pack they land in.

  health:
    content_type: health
    normalizer: amazon_meta
    source: amazon_reviews_2023
    path: datasets/amazon/meta/Health_and_Household.csv
    id_column: parent_asin
    title_column: title
    description_column: description
    category_columns:
      - categories
    creator_columns:
      - store
    release_date_column: null
    popularity_column: rating_number
    rating_column: average_rating
    metadata_columns:
      - title
      - store
      - main_category
      - categories
      - description

  industrial:
    content_type: industrial
    normalizer: amazon_meta
    source: amazon_reviews_2023
    path: datasets/amazon/meta/Industrial_and_Scientific.csv
    id_column: parent_asin
    title_column: title
    description_column: description
    category_columns:
      - categories
    creator_columns:
      - store
    release_date_column: null
    popularity_column: rating_number
    rating_column: average_rating
    metadata_columns:
      - title
      - store
      - main_category
      - categories
      - description

  # Finance books, alongside the Amazon software rows below rather than
  # replacing them. Finance is not one of Amazon's 28 top-level categories, so
  # the Software > Accounting & Finance subtree is the whole of what that source
  # can give: 725 rows, against 20,000 each for health and industry. Office
  # Products was the obvious next source and does not work - its "Forms,
  # Recordkeeping & Money Handling" node is mostly clipboards, key cabinets and
  # award certificates, and only ~90 of 365 sampled rows were financial at all.
  #
  # Open Library carries over a million finance-subject works, needs no key, and
  # its rows already normalize through `books`. This is a config entry rather
  # than new code:
  #   python -m scripts.fetch_openlibrary_books --subject "personal finance" ...
  #     --per-subject 400 --out datasets/books/openlibrary_finance.csv
  #     --require-category-term "financ|money|invest|account|tax|bank|budget|..."
  #
  # That last flag matters. Open Library subjects are user-contributed, so a
  # vertical sweep drags in mis-tagged works: 6.4% of the finance rows had no
  # finance term in their subjects at all, including "Tropic of Cancer" and
  # "Girl, Woman, Other". Filtering on subjects rather than titles keeps the
  # genuine juvenile-finance books ("Smart Money Smart Kids") while dropping
  # the novels. A second pass then drops what survived it:
  #     --exclude-category-term "(?i)^(?=.*(?:fiction|romance|novel|fantasy))(?!.*(?:financ|money|invest|account|tax|bank|budget|econom|wealth|debt|credit|saving|business|entrepreneur|commerce)).*"
  # A novel can carry one stray on-topic subject and clear the require pass -
  # a Depression-era novel tagged "Stock Market Crash" was sitting in the
  # finance vertical - so the lookahead reads "fiction, unless it also has a
  # real finance subject".
  #
  # content_type `finance` puts these in the finance domain pack, so they carry
  # its risk_tier 1 advisory and its `adult` default. Any book_id already in the
  # books catalogue is dropped from this file, so no work appears under two
  # content types.
  finance_books:
    content_type: finance
    normalizer: books
    source: openlibrary_api
    path: datasets/books/openlibrary_finance.csv
    id_column: book_id
    title_column: title
    description_column: description
    category_columns:
      - categories
      - search_category
    creator_columns:
      - authors
    release_date_column: published_date
    popularity_column: ratings_count
    rating_column: average_rating
    metadata_columns:
      - title
      - subtitle
      - authors
      - categories
      - description

  finance:
    content_type: finance
    normalizer: amazon_meta
    source: amazon_reviews_2023
    # Finance is not one of Amazon's 28 top-level categories, but Software
    # carries a real "Accounting & Finance" subtree. Carved out with:
    #   python -m scripts.fetch_amazon_metadata --category Software \
    #     --category-filter "Accounting & Finance|Tax Preparation|Personal Finance|Payroll|Investment Tools" \
    #     --out-name Finance
    path: datasets/amazon/meta/Finance.csv
    id_column: parent_asin
    title_column: title
    description_column: description
    category_columns:
      - categories
    creator_columns:
      - store
    release_date_column: null
    popularity_column: rating_number
    rating_column: average_rating
    metadata_columns:
      - title
      - store
      - main_category
      - categories
      - description
